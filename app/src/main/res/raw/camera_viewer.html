<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #cfe6f5; font-family: sans-serif; }
  img, video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #status { position: fixed; left: 16px; bottom: 16px; font-size: 13px; letter-spacing: 0.12em; color: #9fb4c8; }
  .hide { display: none; }
</style>
</head>
<body>
<img id="still" alt="camera" src="/snapshot.jpg">
<video id="rtc" class="hide" autoplay playsinline muted></video>
<img id="mjpeg" class="hide" alt="mjpeg">
<div id="status">Connecting</div>
<script>
(function () {
  var still = document.getElementById('still');
  var rtc = document.getElementById('rtc');
  var mjpeg = document.getElementById('mjpeg');
  var status = document.getElementById('status');
  var live = false;

  function showMjpeg() {
    if (live) return;
    live = true;
    rtc.className = 'hide';
    still.className = 'hide';
    mjpeg.className = '';
    mjpeg.src = '/stream?t=' + Date.now();
    status.textContent = 'MJPEG';
  }

  function waitIce(pc) {
    return new Promise(function (resolve) {
      if (pc.iceGatheringState === 'complete') { resolve(); return; }
      var timer = setTimeout(resolve, 4000);
      pc.addEventListener('icegatheringstatechange', function () {
        if (pc.iceGatheringState === 'complete') {
          clearTimeout(timer);
          resolve();
        }
      });
    });
  }

  function startWebRtc() {
    var pc = new RTCPeerConnection({ iceServers: [] });
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.ontrack = function (event) {
      var stream = (event.streams && event.streams[0]) || new MediaStream([event.track]);
      rtc.srcObject = stream;
      still.className = 'hide';
      mjpeg.className = 'hide';
      rtc.className = '';
      status.textContent = 'WebRTC';
      live = true;
    };
    pc.onconnectionstatechange = function () {
      if (pc.connectionState === 'failed') showMjpeg();
    };
    return pc.createOffer().then(function (offer) {
      return pc.setLocalDescription(offer);
    }).then(function () {
      return waitIce(pc);
    }).then(function () {
      var local = pc.localDescription;
      return fetch('/offer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: local.type, sdp: local.sdp })
      });
    }).then(function (response) {
      if (!response.ok) throw new Error('offer');
      return response.json();
    }).then(function (answer) {
      return pc.setRemoteDescription(answer);
    }).then(function () {
      setTimeout(function () {
        if (!live) showMjpeg();
      }, 7000);
    });
  }

  startWebRtc().catch(function () { showMjpeg(); });
})();
</script>
</body>
</html>
