[versions]
agp = "8.7.3"
kotlin = "2.1.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
coroutines = "1.10.2"
serialization = "1.8.1"
